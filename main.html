
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	<!-- the entire body must be written by student -->

    <form method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Name" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Email" required>
        <br><br>

        <label>Gender</label><br>
        <label for="gender_m">
            <input type="radio" id="gender_m" name="gender" value="Male" required> Male
        </label>

        <label for="gender_f">
            <input type="radio" id="gender_f" name="gender" value="Female"> Female
        </label>
        <br><br>

        <label for="cars">Car Brands</label>
        <select id="cars" name="cars" required>
            <option value="">--Please choose an option--</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Lamborghini">Lamborghini</option>
        </select>
        <br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Age" min="1" max="120" required>
        <br><br>

		<label for='dob'>DOB</label>
		<input type='date' id='dob' required>
		<br><br>

		<label for='tel'>Phone Number</label>
		<input type='tel' id='tel'>
		<br><br>

		<label for='password'>Password</label>
		<input type='password' id='password' placeholder='Password' required>
		<br><br>

		<label for='tos'>
			<input type='checkbox' id='tos' required> I agree to the TOS
		</label>

        <button type='submit'>Submit</button>
    </form>
</body>
</html>
